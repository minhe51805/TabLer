version: 2

secret:
  # Test fixtures and contract data never hold real credentials.
  ignored_paths:
    - tests/**
    - "**/*.test.ts"
    - "**/*.test.tsx"

  ignored_matches:
    # Tauri updater public keys — public by design, embedded in every
    # shipped installer so clients can verify update signatures.
    - match: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEE4RDZDMUUxQ0JDQjU5MjUKUldRbFdjdkw0Y0hXcUVKK3NVa3o2VUsvK2QrUEJYbFhjekJ0TWtYV1FQb21SU0ZWak5IcnVndnIK
      name: updater public key (current)
    - match: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDVGQTg4RjQxRkZGRDdGOUYKUldTZmYvMy9RWStvWDIzbkx3Z3ovMEFwSS84ODZKY2xuc0MrRDVMUkN0REVZdkYwVFViODFPTWwK
      name: updater public key (previous)
    # Literal fixture in workspace_bundle.rs tests asserting that
    # passwords are stripped from exported bundles.
    - match: super-secret
      name: bundle test fixture password
    # Content-gate test fixtures — deliberately shaped like secrets so the
    # rejection tests exercise the detector, but they are literals in test
    # code, not live credentials.
    - match: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
      name: content-gate JWT fixture (public jwt.io sample)
    - match: 6a69dd9a326709cf18a32d44
      name: content-gate ObjectId fixture
    - match: sk-123
      name: content-gate API-key fixture
    # Website docs placeholders — connection-URI examples use the literal
    # word "password" as a stand-in, not a real credential.
    - match: password
      name: docs connection-URI placeholder
      name: bundle test fixture password
