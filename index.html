<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabLeR - Database Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
      }

      body {
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
          system-ui, sans-serif;
      }

      #boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 34%, rgba(0, 122, 255, 0.07), transparent 46%),
          #ffffff;
        color: #1c1c1e;
        z-index: 9999;
      }

      #boot-screen.is-hidden {
        display: none;
      }

      .boot-card {
        width: min(360px, calc(100% - 40px));
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 18px;
        padding: 40px 32px;
        box-sizing: border-box;
      }

      .boot-spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(0, 122, 255, 0.16);
        border-top-color: #007aff;
        animation: boot-spin 0.85s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .boot-brand {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.1;
      }

      .boot-status {
        min-height: 18px;
        max-width: 300px;
        font-size: 13px;
        line-height: 1.5;
        color: #8e8e93;
        word-break: break-word;
        transition: color 0.15s ease;
      }

      .boot-status.is-warning {
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(197, 91, 0, 0.22);
        background: rgba(197, 91, 0, 0.08);
        color: #c55b00;
      }

      .boot-meta {
        font-family: "DM Mono", ui-monospace, "SFMono-Regular", monospace;
        font-size: 11px;
        letter-spacing: 0.02em;
        color: #b8b8bd;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-screen">
      <div class="boot-card">
        <div class="boot-spinner" aria-hidden="true"></div>
        <div class="boot-brand">TableR</div>
        <div id="boot-status" class="boot-status" role="status" aria-live="polite">Loading application bundle...</div>
        <div class="boot-meta"><span id="boot-meta-time">Started just now</span></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        const bootScreen = document.getElementById("boot-screen");
        const bootStatus = document.getElementById("boot-status");
        const bootMetaTime = document.getElementById("boot-meta-time");
        const startedAt = Date.now();
        window.__TABLER_BOOTED__ = false;
        window.__TABLER_HIDE_BOOT_SCREEN__ = function () {
          window.__TABLER_BOOTED__ = true;
          if (bootScreen) {
            bootScreen.classList.add("is-hidden");
          }
        };
        window.__TABLER_SET_BOOT_STATUS__ = function (message, tone) {
          if (!bootStatus) return;
          bootStatus.textContent = message;
          bootStatus.classList.toggle("is-warning", tone === "warning");
        };

        setTimeout(function () {
          if (window.__TABLER_BOOTED__) return;
          window.__TABLER_SET_BOOT_STATUS__?.(
            "Startup is taking longer than expected. The frontend bundle may have failed to load or the WebView runtime may be blocked on this machine.",
            "warning"
          );
          if (bootMetaTime) {
            bootMetaTime.textContent = "Still waiting after 8 seconds";
          }
        }, 8000);

        setTimeout(function () {
          if (window.__TABLER_BOOTED__) return;
          window.__TABLER_SET_BOOT_STATUS__?.(
            "TableR is still waiting for the frontend to boot. If this stays here, please send a screenshot because the issue is now happening before React finishes startup.",
            "warning"
          );
          if (bootMetaTime) {
            bootMetaTime.textContent =
              "Still waiting after " + Math.round((Date.now() - startedAt) / 1000) + " seconds";
          }
        }, 20000);
      })();
    </script>
    <script type="module">
      import("/src/main.tsx").catch((error) => {
        console.error("[TableR boot] Failed to import main entry", error);
        const message = error instanceof Error ? error.message : String(error ?? "Unknown import error");
        window.__TABLER_SET_BOOT_STATUS__?.(
          `Failed to load frontend bundle: ${message}`,
          "warning"
        );
      });
    </script>
  </body>
</html>
